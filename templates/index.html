<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2Audio Dashboard</title>
    <link rel="icon" id="dynamic-favicon" href="/favicon_base.png">
    <!-- Basecoat 1.0.2 (basecoatui.com, MIT), vendored from basecoat-css/dist/basecoat.cdn.min.css -->
    <link rel="stylesheet" href="/static/vendor/basecoat.cdn.min.css">
    <link rel="stylesheet" href="/static/stylesheet.css">
    <script>(function(){var t=localStorage.getItem('theme');var d=t==='dark'||(t!=='light'&&!matchMedia('(prefers-color-scheme: light)').matches);document.documentElement.classList.toggle('dark',d);}());</script>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="header-left">
                <h1>Live2Audio</h1>
                <span class="badge status-badge" data-variant="success" id="system-status-badge">● ONLINE</span>
            </div>

            <div class="header-center">
                <div class="mini-stat">
                    <span class="mini-stat-value" id="uptime-val">{{ uptime }}</span>
                    <span class="mini-stat-label">Uptime</span>
                </div>
                <div class="mini-stat">
                    <span class="mini-stat-value" id="live-count-val">{{ live_count }}</span>
                    <span class="mini-stat-label">Live</span>
                </div>
            </div>

            <div class="header-right">
                <button class="btn" data-variant="destructive" data-size="sm" onclick="openErrorModal()" id="errorBtn" hidden>⚠ Errors</button>
                <button class="btn" data-variant="outline" data-size="sm" id="themeBtn" onclick="cycleTheme()">Auto</button>
                <button class="btn" data-variant="outline" data-size="sm" onclick="openReorderModal()" id="reorderBtn">↕ Order</button>
                <button class="btn" data-variant="outline" data-size="sm" onclick="refreshM3U()" id="refreshBtn">↻ Refresh</button>
                <button class="btn" data-size="sm" onclick="openModal()">+ Add Station</button>
            </div>
        </header>

        <section>
            <div id="stream-list-container"></div>
        </section>

    </div>

    <!-- Playback Bar -->
    <div id="playback-bar" class="playback-bar">
        <audio id="main-audio" preload="none"></audio>
        <div class="playback-top">
            <div class="playback-content">
                <img id="playback-logo" src="" class="playback-logo-small" alt="" onerror="this.style.background='var(--logo-placeholder)'">
                <div class="playback-info-text">
                    <span id="playback-station-name" class="playback-name">Station Name</span>
                    <span id="playback-status" class="playback-status">Currently Playing</span>
                </div>
            </div>
            <button class="btn stop-btn" data-variant="destructive" data-size="xs" onclick="stopAllAudio()">Stop</button>
        </div>
        <div class="volume-container">
            <button id="mute-btn" class="btn volume-icon" data-variant="ghost" data-size="icon-xs" onclick="toggleMute()" title="Mute/Unmute">🔊</button>
            <input type="range" class="input volume-slider" id="volume-control" min="0" max="1" step="0.01" value="0.5" aria-label="Volume">
        </div>
    </div>

    <!-- Station Dialog -->
    <dialog class="dialog" id="stationDialog" aria-labelledby="modalTitle">
        <div>
            <header>
                <h2 id="modalTitle">Add New Station</h2>
            </header>
            <section class="fields">
                <input type="hidden" id="oldStationUrl">
                <div class="field">
                    <label for="stationUrl">YouTube URL or Video ID</label>
                    <input type="text" id="stationUrl" placeholder="https://youtube.com/watch?v=...">
                </div>
                <div class="field">
                    <label for="stationName">Station Name</label>
                    <input type="text" id="stationName" placeholder="Lofi Radio">
                </div>
                <div class="field">
                    <label for="stationId">Station ID (Optional)</label>
                    <input type="text" id="stationId" placeholder="LofiGirl">
                </div>
                <div class="field">
                    <label for="stationGroup">Group (Optional)</label>
                    <input type="text" id="stationGroup" placeholder="YouTube Radio">
                </div>
            </section>
            <footer>
                <button class="btn" data-variant="destructive" id="deleteBtn" onclick="openDeleteConfirmModal()" hidden>Delete</button>
                <button class="btn" data-variant="secondary" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="handleStationSubmit()" id="submitBtn">Save Station</button>
            </footer>
        </div>
    </dialog>

    <!-- Delete Confirm Dialog -->
    <dialog class="dialog" id="deleteConfirmDialog" role="alertdialog" aria-labelledby="deleteConfirmTitle" aria-describedby="deleteConfirmText">
        <div class="dialog-narrow">
            <header>
                <h2 id="deleteConfirmTitle" class="danger">Delete Station</h2>
            </header>
            <section>
                <p id="deleteConfirmText" class="dialog-subtitle"></p>
            </section>
            <footer>
                <button class="btn" data-variant="secondary" onclick="closeDeleteConfirmModal()">Cancel</button>
                <button class="btn" data-variant="destructive" id="confirmDeleteBtn" onclick="confirmDeleteStation()">Delete</button>
            </footer>
        </div>
    </dialog>

    <!-- Error Dialog -->
    <dialog class="dialog" id="errorDialog" aria-labelledby="errorDialogTitle">
        <div>
            <header>
                <h2 id="errorDialogTitle" class="danger">Session Error Log</h2>
            </header>
            <section id="error-log-container-modal" class="error-list">
                <!-- Errors will be populated here -->
            </section>
            <footer>
                <button class="btn" data-variant="secondary" onclick="closeErrorModal()">Close</button>
            </footer>
        </div>
    </dialog>

    <!-- Cast Dialog -->
    <dialog class="dialog" id="castDialog" aria-labelledby="castModalTitle">
        <div>
            <header>
                <div class="dialog-title-row">
                    <h2 id="castModalTitle">Cast to Device</h2>
                    <button class="btn" data-variant="outline" data-size="sm" onclick="refreshDevices()" id="refreshDevicesBtn">↻ Refresh</button>
                </div>
            </header>
            <section class="fields">
                <p id="castStationName" class="dialog-subtitle"></p>
                <div class="field">
                    <label for="manualDeviceIp">Manual Device entry (IP or Location URL)</label>
                    <div class="inline-row">
                        <input type="text" class="input" id="manualDeviceIp" placeholder="192.168.1.100">
                        <button class="btn" data-size="sm" onclick="castToManualIp()">Cast to IP</button>
                    </div>
                </div>
                <div id="device-list" class="device-list">
                    <!-- Devices will be populated here -->
                    <p class="note">Searching for devices...</p>
                </div>
            </section>
            <footer>
                <button class="btn" data-variant="secondary" onclick="closeCastModal()">Cancel</button>
            </footer>
        </div>
    </dialog>

    <!-- Reorder Dialog -->
    <dialog class="dialog" id="reorderDialog" aria-labelledby="reorderTitle">
        <div class="reorder-modal">
            <header>
                <div class="dialog-title-row">
                    <h2 id="reorderTitle">Reorder Stations</h2>
                    <button class="btn" data-variant="secondary" data-size="sm" onclick="closeReorderModal()" aria-label="Close">✕</button>
                </div>
                <p class="dialog-hint">Drag to reorder. Blank lines separate groups in the saved file.</p>
            </header>
            <div id="reorder-list" class="reorder-list"></div>
            <footer>
                <button class="btn" data-variant="secondary" onclick="closeReorderModal()">Cancel</button>
                <button class="btn" onclick="saveOrder()" id="saveOrderBtn">Save Order</button>
            </footer>
        </div>
    </dialog>

    <script>const SERVER_ID = '{{ server_id }}';</script>
    <script src="/static/script.js"></script>
</body>
</html>
